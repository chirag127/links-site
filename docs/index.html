<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>links-site — curated 2026 dev sites</title>
<meta name="description" content="Astro source for links.oriz.in — 100+ hand-picked, 2026-verified dev sites in a curated editorial directory.">
<style>
:root{--bg:#0a1929;--fg:#f5efe0;--accent:#ffb700;--muted:#c8bfa8;--rule:#1e3a5f;--panel:#122b45}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:grid;place-items:center;min-height:100vh;padding:2rem}
main{max-width:38rem;text-align:center}
h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(2.2rem,7vw,3.6rem);margin:0 0 .5rem;letter-spacing:-.02em}
.accent{color:var(--accent)}
p{color:var(--muted);font-size:1.05rem;line-height:1.6}
.cta{display:inline-flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap;justify-content:center}
a.btn{text-decoration:none;padding:.7rem 1.4rem;border-radius:.5rem;font-weight:600;border:1px solid var(--rule)}
a.primary{background:var(--accent);color:var(--bg)}
a.ghost{color:var(--fg);background:var(--panel)}
footer{margin-top:2.5rem;color:var(--rule);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>links<span class="accent">-site</span></h1>
<p>Astro source for <strong>links.oriz.in</strong> — 100+ hand-picked, 2026-verified developer sites, presented as a curated editorial directory.</p>
<div class="cta">
<a class="btn primary" href="https://links.oriz.in">Visit the directory</a>
<a class="btn ghost" href="https://github.com/chirag127/links-site">Source on GitHub</a>
</div>
<footer>MIT licensed · built with Astro</footer>
</main>
</body>
</html>
